name: Maintenance
on:
  push:
  pull_request:
  schedule:
    - cron: "23 9 * * 1"
permissions:
  contents: read
jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm audit --audit-level=low
  ollama-image:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f deploy/secure/Ollama.Dockerfile -t jobhunter-ollama:review .
      - run: |
          docker run -d --name ollama-check -p 127.0.0.1:11434:11434 jobhunter-ollama:review
          for i in $(seq 1 60); do curl -f http://127.0.0.1:11434/api/version && break; sleep 1; done
          curl -f http://127.0.0.1:11434/api/tags
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.76.2
          image-ref: jobhunter-ollama:review
          scanners: vuln
          format: json
          output: ollama-image.json
          exit-code: '1'
          ignore-unfixed: false
      - uses: actions/upload-artifact@v4
        with:
          name: ollama-image-review-${{ runner.arch }}
          path: ollama-image.json
      - if: always()
        run: docker rm -f ollama-check
  application-image:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: |
          docker build -t jobhunter-app:review .
          docker run -d --name app-check -p 127.0.0.1:18090:8090 jobhunter-app:review
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:18090/ -o /tmp/page.html && break; sleep 1; done
          grep -q JobHunter /tmp/page.html
          docker exec app-check sh -ec '! command -v npm; ! command -v yarn'
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.76.2
          image-ref: jobhunter-app:review
          scanners: vuln
          format: json
          output: application-image.json
          exit-code: '1'
          ignore-unfixed: false
      - uses: actions/upload-artifact@v4
        with:
          name: application-image-review-${{ runner.arch }}
          path: application-image.json
      - if: always()
        run: docker logs app-check; docker rm -f app-check
