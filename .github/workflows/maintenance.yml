name: Maintenance
on:
  push:
  pull_request:
  schedule:
    - cron: "23 9 * * 1"
permissions:
  contents: read
jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm audit --audit-level=low
