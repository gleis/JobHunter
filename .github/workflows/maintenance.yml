name: Maintenance
on:
  push:
  pull_request:
  schedule:
    - cron: "23 9 * * 1"
permissions:
  contents: read
jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm audit --audit-level=low
  ollama-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f deploy/secure/Ollama.Dockerfile -t jobhunter-ollama:review .
      - run: |
          docker run -d --name ollama-check -p 127.0.0.1:11434:11434 jobhunter-ollama:review
          for i in $(seq 1 60); do curl -f http://127.0.0.1:11434/api/version && break; sleep 1; done
          curl -f http://127.0.0.1:11434/api/tags
      - uses: aquasecurity/trivy-action@0.35.0
        with:
          version: v0.76.2
          image-ref: jobhunter-ollama:review
          scanners: vuln
          format: json
          output: ollama-image.json
          exit-code: '0'
          ignore-unfixed: false
      - uses: actions/upload-artifact@v4
        with:
          name: ollama-image-review
          path: ollama-image.json
      - if: always()
        run: docker rm -f ollama-check
